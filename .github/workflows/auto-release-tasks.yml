name: Auto-Release Inactive Translation Tasks

on:
  schedule:
    # يعمل يومياً في منتصف الليل UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - name: Release inactive assigned issues
        uses: actions/github-script@v7
        with:
          script: |
            const daysLimit = 5;
            const threshold = new Date(Date.now() - daysLimit * 24 * 60 * 60 * 1000);

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'in progress'
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;
              const updatedAt = new Date(issue.updated_at);

              if (updatedAt < threshold && issue.assignees && issue.assignees.length > 0) {
                console.log(`Auto-releasing issue #${issue.number} due to 5 days inactivity...`);

                // 1. إزالة الـ Assignees
                await github.rest.issues.removeAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: issue.assignees.map(a => a.login)
                });

                // 2. تحديث الملصقات
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: 'in progress'
                });

                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['help wanted']
                });

                // 3. إضافة تعليق توضيحي
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `🔄 **تحرير المهمة التلقائي**: تم فك حجز هذه المهمة وإعادتها لقائمة المهام المتاحة (\`help wanted\`) لعدم وجود نشاط خلال ${daysLimit} أيام، وذلك لإتاحة الفرصة لمساهمين آخرين.`
                });
              }
            }
