name: Issue Self-Assigner Bot

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  self-assign:
    runs-on: ubuntu-latest
    if: "!github.event.issue.pull_request"
    steps:
      - name: Check for self-assignment command
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = context.payload.comment.body.trim().toLowerCase();
            const commenter = context.payload.comment.user.login;
            const issueNumber = context.payload.issue.number;

            const triggerCommands = ['.take', '/claim', '!assign', 'سأقوم بالترجمة', 'سأتكفل بالترجمة'];
            const isMatch = triggerCommands.some(cmd => commentBody.includes(cmd));

            if (!isMatch) return;

            console.log(`Assigning issue #${issueNumber} to user: ${commenter}`);

            // 1. تعيين المستخدم كـ Assignee
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: [commenter]
            });

            // 2. تحديث الملصقات
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['in progress']
            });

            // 3. كتابة رد ترحيبي وتشجيعي مع رابط صفحة المهام الخاصة بالمستخدم
            const replyMessage = `مرحباً @${commenter}! 🌟\n\nتم تعيين هذه المهمة لك بنجاح وتم قفلها باسمك.\n\n**الخطوات التالية للبدء بالترجمة:**\n1. توجه مباشرة إلى صفحة مهامك في المنصة للبدء بالتحرير:\n   👉 **[http://localhost:8000/ar/my-tasks](http://localhost:8000/ar/my-tasks)**\n2. أو يمكنك فتح فرع محلي بجهازك وإرسال Pull Request وكتابة \`Closes #${issueNumber}\` في وصف الـ PR ليتم إغلاق الـ Issue تلقائياً عند الدمج.\n\nشكراً لمساهمتك القيمة في إثراء المحتوى العربي! 🚀`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: replyMessage
            });

