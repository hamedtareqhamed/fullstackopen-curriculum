name: Upstream Sync Monitor

on:
  schedule:
    # يعمل كل 6 ساعات لتفقد أي تعديلات جديدة من جامعة هلسنكي
    - cron: '0 */6 * * *'
  workflow_dispatch: # إمكانية التشغيل اليدوي بنقرة زر

permissions:
  contents: write
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Helsinki upstream commits & create issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-upstream.js

      - name: Commit updated tracking state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-tracking.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): update upstream tracking state [skip ci]" && git push)
